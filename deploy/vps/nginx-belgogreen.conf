# BelGoGreen Odoo (container odoo-belgogreen). Replace __DOMAIN__, then
# "certbot --nginx -d __DOMAIN__" adds HTTPS and the redirect, as for the
# other sites.
upstream belgogreen_odoo {
    server 127.0.0.1:8077;
}
upstream belgogreen_odoo_ws {
    server 127.0.0.1:8078;
}
# own name: the other sites may already define a $connection_upgrade map
map $http_upgrade $belgogreen_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # DMS files and attachments
    client_max_body_size 200m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    access_log /var/log/nginx/belgogreen.access.log;
    error_log /var/log/nginx/belgogreen.error.log;

    # live notifications (chat, activities): the gevent port
    location /websocket {
        proxy_pass http://belgogreen_odoo_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $belgogreen_connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://belgogreen_odoo;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/json application/javascript image/svg+xml;
}
