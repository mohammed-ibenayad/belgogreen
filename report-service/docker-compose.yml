services:
  report-service:
    build: .
    container_name: belgogreen-report-service
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - PORT=3002
      - API_KEY=${API_KEY}
      - NODE_ENV=production
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - report-network

networks:
  report-network:
    driver: bridge
